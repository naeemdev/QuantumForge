# Local QuantumForge stack: PostgreSQL, API, web console.
# Blobs (snapshots, evidence) are stored on the blob-data volume. To use an
# S3-compatible service instead, set QF_STORAGE_TYPE=s3 and the QF_S3_* variables.
#
#   cp .env.example .env
#   docker compose up --build                         # control plane only
#   docker compose --profile dev-worker up --build    # plus a development worker
#
# The dev worker runs jobs with dev-process isolation and is only dispatched to
# because QF_ALLOW_DEV_ISOLATION=true below. Never use this file as-is in production.
name: quantumforge

services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: quantumforge
      POSTGRES_USER: quantumforge
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env}
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U quantumforge -d quantumforge"]
      interval: 5s
      timeout: 3s
      retries: 20
    ports:
      - "127.0.0.1:5432:5432"

  api:
    build:
      context: .
      dockerfile: infrastructure/docker/api.Dockerfile
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      SPRING_PROFILES_ACTIVE: ${QF_PROFILE:-dev}
      QF_DB_URL: jdbc:postgresql://postgres:5432/quantumforge
      QF_DB_USER: quantumforge
      QF_DB_PASSWORD: ${POSTGRES_PASSWORD}
      QF_STORAGE_TYPE: ${QF_STORAGE_TYPE:-filesystem}
      QF_STORAGE_ROOT: /data/blobs
      QF_S3_ENDPOINT: ${QF_S3_ENDPOINT:-}
      QF_S3_BUCKET: ${QF_S3_BUCKET:-quantumforge}
      QF_S3_ACCESS_KEY: ${QF_S3_ACCESS_KEY:-}
      QF_S3_SECRET_KEY: ${QF_S3_SECRET_KEY:-}
      QF_DEV_LOGIN: ${QF_DEV_LOGIN:-true}
      QF_ALLOW_DEV_ISOLATION: ${QF_ALLOW_DEV_ISOLATION:-true}
      QF_DEV_WORKER_TOKEN: ${QF_DEV_WORKER_TOKEN:?set QF_DEV_WORKER_TOKEN in .env}
      QF_OIDC_ISSUER: ${QF_OIDC_ISSUER:-}
      QF_OIDC_AUDIENCE: ${QF_OIDC_AUDIENCE:-}
      QF_CORS_ORIGINS: http://localhost:3000
    volumes:
      - blob-data:/data/blobs
    ports:
      - "127.0.0.1:8080:8080"
    # 8081 (worker API) is deliberately not published to the host.
    networks: [default, workers]

  web:
    build:
      context: .
      dockerfile: infrastructure/docker/web.Dockerfile
      args:
        NEXT_PUBLIC_API_URL: http://localhost:8080
    depends_on:
      api:
        condition: service_healthy
    ports:
      - "127.0.0.1:3000:3000"

  worker-dev:
    profiles: ["dev-worker"]
    build:
      context: .
      dockerfile: infrastructure/docker/worker.Dockerfile
    depends_on:
      api:
        condition: service_healthy
    environment:
      QF_CONTROL_PLANE_URL: http://api:8081
      QF_WORKER_TOKEN: ${QF_DEV_WORKER_TOKEN}
      QF_ISOLATION_MODE: dev-process
    # The worker can reach the API's internal port and nothing else of ours:
    # not PostgreSQL, not the blob store.
    networks: [workers]
    read_only: true
    tmpfs:
      - /work:size=1g
      - /tmp:size=256m
    cap_drop: [ALL]
    security_opt: ["no-new-privileges:true"]
    pids_limit: 512
    mem_limit: 2g
    cpus: 2

networks:
  default: {}
  workers:
    internal: true

volumes:
  postgres-data:
  blob-data:
