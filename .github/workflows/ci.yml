name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    name: API and worker
    runs-on: ubuntu-24.04
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_DB: quantumforge_test
          POSTGRES_USER: quantumforge
          POSTGRES_PASSWORD: quantumforge
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U quantumforge"
          --health-interval 5s --health-timeout 3s --health-retries 20
    env:
      QF_TEST_DB_URL: jdbc:postgresql://localhost:5432/quantumforge_test
      QF_TEST_S3_ENDPOINT: http://localhost:9000
      QF_TEST_S3_ACCESS_KEY: ci-access-key
      QF_TEST_S3_SECRET_KEY: ci-secret-key-0123456789
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
      - uses: actions/setup-node@v4
        with:
          node-version: "22.22"
      - uses: gradle/actions/setup-gradle@v4
      - name: Start MinIO
        run: |
          docker run -d --name minio -p 9000:9000 \
            -e MINIO_ROOT_USER=$QF_TEST_S3_ACCESS_KEY -e MINIO_ROOT_PASSWORD=$QF_TEST_S3_SECRET_KEY \
            minio/minio:RELEASE.2025-04-22T22-12-26Z server /data
          for i in $(seq 1 30); do curl -fs http://localhost:9000/minio/health/live && break; sleep 1; done
      - name: Test
        run: ./gradlew test --console=plain
      - name: OpenAPI contract is up to date
        run: |
          ./gradlew :services:api:exportOpenApi --console=plain
          git diff --exit-code packages/contracts/openapi.json
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: test-reports
          path: services/*/build/reports/tests

  web:
    name: Web console
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22.22"
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Generated types match the OpenAPI document
        run: |
          pnpm contracts:generate
          git diff --exit-code packages/contracts/src/schema.ts
      - run: pnpm typecheck
      - run: pnpm lint
      - run: pnpm web:build

  corpus:
    name: Bug corpus
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22.22"
      - run: scripts/verify-bug-corpus.sh

  images:
    name: Container images
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - run: docker build -f infrastructure/docker/api.Dockerfile -t quantumforge-api:ci .
      - run: docker build -f infrastructure/docker/worker.Dockerfile -t quantumforge-worker:ci .
      - run: docker build -f infrastructure/docker/web.Dockerfile -t quantumforge-web:ci .
