name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    name: API and worker
    runs-on: ubuntu-24.04
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_DB: quantumforge_test
          POSTGRES_USER: quantumforge
          POSTGRES_PASSWORD: quantumforge
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U quantumforge -d quantumforge_test"
          --health-interval 5s --health-timeout 3s --health-retries 20
      # S3-compatible test server for the S3 BlobStore contract test.
      s3:
        image: adobe/s3mock:4.11.0
        ports: ["9090:9090"]
    env:
      QF_TEST_DB_URL: jdbc:postgresql://localhost:5432/quantumforge_test
      QF_TEST_S3_ENDPOINT: http://localhost:9090
      QF_TEST_S3_ACCESS_KEY: ci-access-key
      QF_TEST_S3_SECRET_KEY: ci-secret-key
      # Container sandbox tests run against the runner's Docker daemon.
      QF_TEST_DOCKER: "1"
      QF_TEST_TS_ANALYZER: /tmp/ts-analyzer
      QF_TEST_CONTAINER_IMAGE: node:22.22-bookworm-slim
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "21"
      - uses: pnpm/action-setup@v5
      - uses: actions/setup-node@v5
        with:
          node-version: "22.22"
          cache: pnpm
      # The integration tests run the TypeScript adapter, which needs its dependencies.
      - run: pnpm install --frozen-lockfile --filter @quantumforge/lang-typescript...
      # Containers cannot follow the workspace's symlinks, so they get a self-contained copy.
      - run: pnpm --filter @quantumforge/lang-typescript deploy --prod --legacy "$QF_TEST_TS_ANALYZER"
      - run: docker pull "$QF_TEST_CONTAINER_IMAGE"
      - uses: gradle/actions/setup-gradle@v5
      - name: Wait for the S3 test server
        run: for i in $(seq 1 60); do curl -s -o /dev/null http://localhost:9090/ && exit 0; sleep 1; done; exit 1
      - name: Test
        run: ./gradlew test --console=plain
      - name: OpenAPI contract is up to date
        run: |
          ./gradlew :services:api:exportOpenApi --console=plain
          git diff --exit-code packages/contracts/openapi.json
      - uses: actions/upload-artifact@v6
        if: failure()
        with:
          name: test-reports
          path: services/*/build/reports/tests

  web:
    name: Web console
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5
      - uses: pnpm/action-setup@v5
      - uses: actions/setup-node@v5
        with:
          node-version: "22.22"
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Generated types match the OpenAPI document
        run: |
          pnpm contracts:generate
          git diff --exit-code packages/contracts/src/schema.ts
      - run: pnpm typecheck
      - run: pnpm --filter @quantumforge/lang-typescript test
      - run: pnpm lint
      - run: pnpm web:build

  e2e:
    name: End-to-end (browser)
    runs-on: ubuntu-24.04
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_DB: quantumforge_e2e
          POSTGRES_USER: quantumforge
          POSTGRES_PASSWORD: quantumforge
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U quantumforge -d quantumforge_e2e"
          --health-interval 5s --health-timeout 3s --health-retries 20
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "21"
      - uses: pnpm/action-setup@v5
      - uses: actions/setup-node@v5
        with:
          node-version: "22.22"
          cache: pnpm
      - uses: gradle/actions/setup-gradle@v5
      - run: pnpm install --frozen-lockfile
      - run: pnpm --filter @quantumforge/e2e exec playwright install --with-deps chromium
      - name: Start API, worker and web console
        run: scripts/e2e-stack.sh start
      - name: Browser tests
        run: pnpm --filter @quantumforge/e2e test
      - name: Stop stack
        if: always()
        run: scripts/e2e-stack.sh stop
      - uses: actions/upload-artifact@v5
        if: failure()
        with:
          name: e2e-report
          path: |
            tests/e2e/playwright-report
            tests/e2e/test-results
            build/e2e/*.log

  corpus:
    name: Bug corpus
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: "22.22"
          # package.json declares pnpm, but this job does not install it.
          package-manager-cache: false
      - run: scripts/verify-bug-corpus.sh

  images:
    name: Container images
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5
      - uses: docker/setup-buildx-action@v3
      - run: docker build -f infrastructure/docker/api.Dockerfile -t quantumforge-api:ci .
      - run: docker build -f infrastructure/docker/worker.Dockerfile -t quantumforge-worker:ci .
      - run: docker build -f infrastructure/docker/web.Dockerfile -t quantumforge-web:ci .
